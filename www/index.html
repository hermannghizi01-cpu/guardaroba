<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guardaroba – il tuo armadio virtuale</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf6f1;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--ac:#8a4b5a;--ac2:#f1e4e6;--bd:#e6ddd3;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1917;--card:#2a2522;--tx:#f3ece6;--mu:#a99d93;--ac:#d98ba0;--ac2:#3b2a30;--bd:#3d3631;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1917;--card:#2a2522;--tx:#f3ece6;--mu:#a99d93;--ac:#d98ba0;--ac2:#3b2a30;--bd:#3d3631;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;line-height:1.45}
.w{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:26px;margin:8px 0 2px}h2{font-size:20px;margin:18px 0 8px}
p.s{color:var(--mu);margin:0 0 14px;font-family:system-ui,sans-serif;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
label{display:block;font:600 14px system-ui,sans-serif;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:14px system-ui,sans-serif;padding:8px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--card);color:var(--tx);cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.p{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 15px system-ui,sans-serif;cursor:pointer;width:100%;margin-top:14px}
button.g{background:var(--ac2);color:var(--ac);border:0;border-radius:10px;padding:8px 12px;font:600 13px system-ui,sans-serif;cursor:pointer}
select,input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:15px system-ui,sans-serif}
.sw{display:inline-block;width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:var(--card)}
.it img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.it .t{font:11px system-ui,sans-serif;padding:4px 6px;display:flex;align-items:center;gap:4px}
.it .x{position:absolute;top:4px;right:4px;background:#000a;color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.out{display:flex;gap:6px;overflow-x:auto}
.out figure{margin:0;flex:0 0 28%;font:11px system-ui,sans-serif;text-align:center;color:var(--mu)}
.out img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.score{font:700 13px system-ui,sans-serif;color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mu);font:600 12px system-ui,sans-serif;padding:6px 10px;cursor:pointer}
nav button.on{color:var(--ac)}
.hide{display:none}
a.l{display:block;padding:12px;border:1px solid var(--bd);border-radius:12px;margin:8px 0;color:var(--ac);text-decoration:none;font:600 14px system-ui,sans-serif}
:root,:root:not([data-theme=light]),:root[data-theme=dark]{--bg:#fff;--card:#fff;--tx:#3b2f33;--mu:#8a7a80;--ac:#e8c1c8;--ac2:#e0eef8;--bd:#f0e0e4;color-scheme:light}
body{background:linear-gradient(#fff,#fdf5f6) fixed}.w{max-width:960px}
button.p{color:#4a2f36;background:#e8c1c8}.chip.on{background:#e8c1c8;color:#4a2f36;border-color:#d99aa6}
button.g{color:#35566f;background:#e0eef8}.score,nav button.on{color:#b86b7a}a.l{color:#35566f}nav{justify-content:center;gap:14px}
#res{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div class="w" id="app"></div>
<nav id="nav" class="hide"></nav>
<script>
const PAL={
 Primavera:{d:'Caldi, chiari e luminosi',c:['#f6e3c4','#f4a97f','#f0c75e','#8fc47a','#4fb3a5','#e8715f','#c9a46a','#fff7e6']},
 Estate:{d:'Freddi, morbidi e polverosi',c:['#c9b8d9','#e5b4c3','#9fb7d4','#a9c7c0','#d7c6d2','#8d9bb5','#c58aa0','#f3eef2']},
 Autunno:{d:'Caldi, profondi e terrosi',c:['#a65a2e','#c58b3a','#6f7a3a','#7a3b2b','#d4a373','#3f5b4a','#8b5e3c','#f0e0c0']},
 Inverno:{d:'Freddi, intensi e netti',c:['#101820','#ffffff','#c2185b','#1e3a8a','#0f766e','#6d28d9','#b91c1c','#9ca3af']}
};
const STYLES=['Classico','Elegante','Casual','Minimal','Boho','Sportivo','Modest chic','Streetwear'];
const OCC=['Quotidiano','Lavoro','Cerimonia','Sera','Università','Estate/mare'];
const CATS=['Top','Pantaloni/Gonna','Abito/Abaya','Giacca/Cardigan','Hijab','Scarpe'];
let S={prof:null,items:[]};
let tab='home',res=[],occ='Quotidiano';
try{const r=localStorage.getItem('guardaroba_v1');if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem('guardaroba_v1',JSON.stringify(S))}catch(e){alert('Memoria piena: elimina qualche foto.')}}
// colori
const h2r=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const r2h=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
function hsl(h){let [r,g,b]=h2r(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let H=0,Sx=0;
 if(d){Sx=d/(1-Math.abs(2*l-1));H=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;H=(H*60+360)%360}return{h:H,s:Sx,l}}
const neutral=h=>{const c=hsl(h);return c.s<.18||c.l<.12||c.l>.93};
const dist=(a,b)=>{const x=h2r(a),y=h2r(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
function palFit(h){const p=palC(S.prof);const m=Math.min(...p.map(c=>dist(h,c)));return Math.max(0,1-m/200)}
function pair(a,b){if(neutral(a)||neutral(b)){const l=Math.abs(hsl(a).l-hsl(b).l);return .8+Math.min(.2,l/3)}
 let d=Math.abs(hsl(a).h-hsl(b).h);d=d>180?360-d:d;
 if(d<25)return .85;if(d<50)return .9;if(d>150)return .8;if(d>100&&d<140)return .6;return .4}
function score(its){let ps=[],n=0,hues=new Set();
 for(let i=0;i<its.length;i++)for(let j=i+1;j<its.length;j++)ps.push(pair(its[i].color,its[j].color));
 const harm=ps.reduce((a,b)=>a+b,0)/(ps.length||1);
 let w=0,f=0;its.forEach(i=>{const k=i.cat=='Hijab'?2.5:1;w+=k;f+=k*palFit(i.color);if(!neutral(i.color))hues.add(Math.round(hsl(i.color).h/40))});
 let sc=.45*harm+.55*(f/w);if(hues.size>3)sc-=.15;return Math.max(0,Math.min(1,sc))}
function why(its,sc){const hj=its.find(i=>i.cat=='Hijab');const nn=its.filter(i=>!neutral(i.color)).length;let t=[];
 if(hj)t.push(palFit(hj.color)>.7?'l\'hijab è in palette e illumina il viso':'hijab vicino alla tua palette');
 t.push(nn==0?'look neutro e raffinato':nn==1?'un solo colore protagonista con neutri':nn==2?'due colori armonizzati':'più colori bilanciati');
 return t.join(' · ')}
function genOutfits(){
 const by=c=>S.items.filter(i=>i.cat==c);const hij=S.prof.hijab;
 const tops=by('Top'),bot=by('Pantaloni/Gonna'),dr=by('Abito/Abaya'),jk=by('Giacca/Cardigan'),hj=by('Hijab'),sh=by('Scarpe');
 const bases=[];dr.forEach(d=>bases.push([d]));tops.forEach(t=>bot.forEach(b=>bases.push([t,b])));
 const list=[];
 bases.forEach(b=>{const hs=hij&&hj.length?hj:[null];hs.forEach(h=>{
  [null,...jk].forEach(j=>{[null,...sh].forEach(s=>{
   const o=[...b,h,j,s].filter(Boolean);if(o.length<2)return;
   const useJ=j&&(occ=='Cerimonia'||occ=='Lavoro'||Math.random()<.5);
   const o2=useJ?o:o.filter(x=>x!==j);
   list.push({its:o2,sc:score(o2)+Math.random()*.03});
  })})})});
 const seen=new Set(),outs=[];list.sort((a,b)=>b.sc-a.sc).forEach(o=>{const k=o.its.map(i=>i.id).join();if(!seen.has(k)&&outs.length<6){seen.add(k);outs.push(o)}});
 res=outs}
// UI
const $=s=>document.querySelector(s);
function chips(id,arr,sel,multi){return `<div class="chips" id="${id}">`+arr.map(a=>`<button type="button" class="chip ${sel.includes(a)?'on':''}" data-v="${a}" data-m="${multi?1:0}">${a}</button>`).join('')+'</div>'}
function render(){
 if(!S.prof){onboard();return}
 $('#nav').className='';$('#nav').innerHTML=[['home','Outfit'],['wardrobe','Armadio'],['insp','Ispirazione'],['prof','Profilo']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
 ({home,wardrobe,insp,prof})[tab]();window.scrollTo(0,0)}
let ob={season:'',sub:'',styles:[],occ:[],hijab:true,under:'',contrast:''};
function onboard(){
 $('#nav').className='hide';
 $('#app').innerHTML=`<h1>Benvenuta ✨</h1><p class="s">Poche domande per creare outfit su misura per te.</p>
 <div class="card"><label>La tua palette di armocromia</label>${chips('c-season',Object.keys(PAL),[ob.season],0)}
 <p class="s" style="margin-top:8px">${ob.season?PAL[ob.season].d:'Scegli la tua stagione. Non la conosci? Rispondi qui sotto.'}</p>
 <div id="sw">${ob.season?palC(ob).map(c=>`<span class="sw" style="background:${c}"></span>`).join(''):''}</div>
 ${ob.season?'<label>Sfumatura (le 12 stagioni)</label>'+chips('c-sub',SUBS[ob.season],[ob.sub],0):''}<div id="quiz" class="${ob.season?'hide':''}"><label>Quali metalli/colori ti donano di più?</label>${chips('c-und',['Oro e colori caldi','Argento e colori freddi'],[ob.under],0)}
 <label>I tuoi colori naturali (pelle, occhi, capelli) sono…</label>${chips('c-con',['Chiari e delicati','Scuri e intensi'],[ob.contrast],0)}
 <button class="g" style="margin-top:10px" id="calc">Suggeriscimi la stagione</button></div></div>
 <div class="card"><label>Il tuo stile (anche più di uno)</label>${chips('c-st',STYLES,ob.styles,1)}
 <label>Per quali occasioni?</label>${chips('c-oc',OCC,ob.occ,1)}
 <label>Indossi l'hijab?</label>${chips('c-hj',['Sì, sempre','Dipende dall\'outfit','No'],[ob.hijab===true?'Sì, sempre':ob.hijab==='x'?'Dipende dall\'outfit':ob.hijab===false?'No':''],0)}</div>
 <button class="p" id="go">Inizia</button>`;
 bindChips()}
function bindChips(){document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
 const id=b.parentNode.id,v=b.dataset.v;
 if(id=='c-season'){ob.season=v;ob.sub=''}if(id=='c-sub')ob.sub=v;if(id=='c-und')ob.under=v;if(id=='c-con')ob.contrast=v;
 if(id=='c-st')ob.styles=tg(ob.styles,v);if(id=='c-oc')ob.occ=tg(ob.occ,v);
 if(id=='c-hj')ob.hijab=v.startsWith('Sì')?true:v.startsWith('Dip')?'x':false;
 onboard()});
 const c=$('#calc');if(c)c.onclick=()=>{if(!ob.under||!ob.contrast){alert('Rispondi a entrambe le domande');return}
  const w=ob.under.startsWith('Oro'),l=ob.contrast.startsWith('Chiari');ob.season=w?(l?'Primavera':'Autunno'):(l?'Estate':'Inverno');onboard()};
 const g=$('#go');if(g)g.onclick=()=>{if(!ob.season){alert('Scegli una palette');return}
  S.prof={season:ob.season,sub:ob.sub,styles:ob.styles.length?ob.styles:['Casual'],occ:ob.occ,hijab:ob.hijab!==false};save();render()}}
const tg=(a,v)=>a.includes(v)?a.filter(x=>x!=v):[...a,v];
function thumb(i){return `<figure><img src="${i.img}" alt="${i.cat}"><span>${i.cat.split('/')[0]}</span></figure>`}
function home(){
 const n=S.items.length;
 $('#app').innerHTML=`<h1>I tuoi outfit</h1><p class="s">Palette ${S.prof.season} · ${S.prof.styles.join(', ')}</p>
 <div class="card"><label style="margin-top:0">Per quale occasione?</label><select id="occ">${OCC.map(o=>`<option ${o==occ?'selected':''}>${o}</option>`).join('')}</select>
 <button class="p" id="gen">Crea i miei outfit</button></div>
 <div id="res">${n<3?'<div class="card">Aggiungi almeno un top + un pantalone/gonna (o un abito) nella sezione <b>Armadio</b> per iniziare.</div>':''}</div>`;
 $('#occ').onchange=e=>occ=e.target.value;
 $('#gen').onclick=()=>{genOutfits();show()};if(res.length)show()}
function show(){
 $('#res').innerHTML=res.length?res.map(o=>`<div class="card"><div class="out">${o.its.map(thumb).join('')}</div>
 <p style="margin:10px 0 0"><span class="score">Compatibilità ${Math.round(o.sc*100)}%</span><br><span class="s">${why(o.its,o.sc)}</span></p></div>`).join(''):'<div class="card">Servono più capi: aggiungi top e pantaloni/gonne oppure abiti.</div>'}
function wardrobe(){
 $('#app').innerHTML=`<h1>Il mio armadio</h1><p class="s">${S.items.length} capi · il colore viene rilevato dalla foto (puoi correggerlo).</p>
 <div class="card"><label style="margin-top:0">Categoria</label><select id="cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
 <input type="file" id="f" accept="image/*" multiple class="hide"><button class="p" onclick="document.getElementById('f').click()">📷 Carica foto</button></div>
 <div class="grid" id="gr">${S.items.map(i=>`<div class="it"><img src="${i.img}" alt=""><button class="x" onclick="del('${i.id}')">×</button>
 <div class="t"><input type="color" value="${i.color}" onchange="recol('${i.id}',this.value)" style="width:22px;height:22px;border:0;padding:0;background:none"> ${i.cat.split('/')[0]}</div></div>`).join('')}</div>`;
 $('#f').onchange=async e=>{for(const f of e.target.files)await add(f,$('#cat').value);save();wardrobe()}}
function add(file,cat){return new Promise(res=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,360/Math.max(im.width,im.height)),w=im.width*k,h=im.height*k,c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
 const d=x.getImageData(w*.3,h*.3,w*.4,h*.4).data;let r=0,g=0,b=0,n=0;
 for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2];n++}
 S.items.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),cat,img:c.toDataURL('image/jpeg',.7),color:r2h(r/n,g/n,b/n)});res()};
 im.src=URL.createObjectURL(file)})}
function del(id){S.items=S.items.filter(i=>i.id!=id);save();wardrobe()}
function recol(id,c){S.items.find(i=>i.id==id).color=c;save()}
function insp(){
 const p=S.prof,names={Primavera:'warm spring colors',Estate:'soft summer colors',Autunno:'earthy autumn colors',Inverno:'bold winter colors'};
 const q=st=>encodeURIComponent(`${st} outfit ${p.hijab?'hijab':''} ${names[p.season]}`.replace(/\s+/g,' ').trim());
 $('#app').innerHTML=`<h1>Ispirazione</h1><p class="s">Ricerche Pinterest basate sul tuo profilo. Si aprono in una nuova scheda.</p>
 ${p.styles.map(s=>`<a class="l" target="_blank" rel="noopener" href="https://www.pinterest.com/search/pins/?q=${q(s)}">📌 Outfit ${s.toLowerCase()} · ${p.season}</a>`).join('')}
 ${p.occ.map(o=>`<a class="l" target="_blank" rel="noopener" href="https://www.pinterest.com/search/pins/?q=${q(o)}">📌 ${o} · look versatili</a>`).join('')}
 <a class="l" target="_blank" rel="noopener" href="https://www.pinterest.com/search/pins/?q=${encodeURIComponent('hijab styling '+names[p.season])}">📌 Abbinamenti hijab ${p.season}</a>
 <h2>La tua palette</h2><div class="card">${palC(p).map(c=>`<span class="sw" style="background:${c}"></span>`).join('')}<p class="s" style="margin:8px 0 0">${PAL[p.season].d}</p></div>`}
function prof(){
 $('#app').innerHTML=`<h1>Profilo</h1><div class="card"><b>${S.prof.season} ${S.prof.sub||''}</b><br><span class="s">${S.prof.styles.join(', ')} · ${S.prof.occ.join(', ')||'tutte le occasioni'}<br>Hijab: ${S.prof.hijab?'sì':'no'}</span>
 <button class="p" id="re">Modifica preferenze</button><button class="g" style="margin-top:8px;width:100%" onclick="redo()">Rifai l’analisi dei colori</button></div>${avCard()}${veilCard(S.prof)}${privCard()}
 <div class="card"><b>Come funziona</b><p class="s" style="margin:6px 0 0">Ogni outfit riceve un punteggio: 55% quanto i colori sono vicini alla tua palette (l'hijab pesa di più, perché è vicino al viso), 45% armonia tra i capi (neutri, analoghi, complementari).</p></div>`;
 $('#re').onclick=()=>{ob={season:S.prof.season,sub:S.prof.sub||'',styles:S.prof.styles,occ:S.prof.occ,hijab:S.prof.hijab,under:'',contrast:''};S.prof=null;onboard()}}
const SUBS={Primavera:['Chiara','Calda','Brillante'],Estate:['Chiara','Fredda','Morbida'],Autunno:['Morbida','Calda','Profonda'],Inverno:['Profonda','Fredda','Brillante']};
const WXS=['Caldo','Mite','Fresco','Freddo','Pioggia'];let wx='Mite';
const HT={Lavoro:'cotone o jersey, drappeggio semplice con piccola spilla',Cerimonia:'chiffon o seta, drappeggio ampio con fermaglio gioiello',Sera:'seta satinata o velluto, stile avvolto o turbante',Università:'jersey comodo con sottocappa, stile pratico',Quotidiano:'jersey o viscosa, stile classico con sottocappa a tono','Estate/mare':'cotone o lino leggero, annodatura morbida e traspirante'};
function fromHsl(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return r2h(f(0)*255,f(8)*255,f(4)*255)}
function palC(p){return PAL[p.season].c.map(c=>{const o=hsl(c),u=p.sub||'';let H=o.h,Sx=o.s,L=o.l;
 if(u=='Chiara')L=Math.min(.92,L+.08);if(u=='Profonda')L=Math.max(.12,L-.08);if(u=='Brillante')Sx=Math.min(1,Sx*1.2);if(u=='Morbida')Sx*=.8;
 if(u=='Calda')H=(H+(((30-H+540)%360)-180)*.1+360)%360;if(u=='Fredda')H=(H+(((220-H+540)%360)-180)*.1+360)%360;
 return fromHsl(H,Sx,L)})}
function cn(h){const c=hsl(h),H=c.h;if(c.l<.14)return['nero','black'];if(c.l>.92&&c.s<.3)return['bianco','white'];
 if(c.s<.15)return c.l<.45?['antracite','charcoal']:['grigio','grey'];
 if(H<40&&c.s<.45&&c.l>.55)return['beige','beige'];if(H<40&&c.s<.5&&c.l<=.55)return['marrone','brown'];
 if(H<15||H>=345)return c.l<.3?['bordeaux','burgundy']:['rosso','red'];if(H<40)return['arancio','orange'];if(H<70)return['senape','mustard'];
 if(H<160)return c.l<.35?['verde bosco','forest green']:['verde','green'];if(H<200)return['petrolio','teal'];
 if(H<255)return c.l<.3?['blu navy','navy']:['azzurro','blue'];if(H<290)return['viola','purple'];return['rosa','pink']}
const wv=i=>i.w||(i.cat.startsWith('Giacca')?3:2);
function adv(o){const its=o.its,t=[],p=S.prof,hj=its.find(i=>i.cat=='Hijab'),main=its.filter(i=>i.cat!='Hijab'&&i.cat!='Scarpe'),warm=p.season=='Primavera'||p.season=='Autunno'||p.sub=='Calda';
